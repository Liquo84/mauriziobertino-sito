name: Pubblica il sito

# Ogni volta che si carica una modifica sul ramo main, la cartella "sito"
# viene pubblicata su GitHub Pages. Nessun passaggio manuale.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Due job: caricare e pubblicare nello stesso job a volte fallisce con
# «No artifacts named github-pages» (actions/deploy-pages, segnalazione del 07/10/2026;
# qui il 25/11/2026, quattro volte di fila).
jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepara la cartella da pubblicare
        run: touch sito/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
